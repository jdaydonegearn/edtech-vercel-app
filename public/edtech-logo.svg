<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#000000" rx="36"/>
  <!-- Stand / Base -->
  <rect x="235" y="215" width="30" height="15" fill="#E2E8F0"/>
  <rect x="200" y="225" width="100" height="10" fill="#E2E8F0"/>
  
  <!-- Camera Top Brackets / Flash & Viewfinder -->
  <path d="M 165 72 H 210 V 88 H 195 V 88 H 165 Z" fill="#E2E8F0" />
  <path d="M 165 72 V 88 H 180 V 82 H 210 V 72 Z" fill="#FFFFFF" />
  
  <path d="M 290 70 H 335 V 105 H 320 V 84 H 290 Z" fill="#94A3B8" />
  <rect x="320" y="70" width="15" height="35" fill="#94A3B8" />
  
  <!-- Camera Frame & "E" "D" Geometric Emblem -->
  <!-- Left Side: Letter E -->
  <rect x="155" y="86" width="105" height="18" fill="#FFFFFF"/>
  <rect x="155" y="86" width="20" height="114" fill="#FFFFFF"/>
  <rect x="155" y="136" width="85" height="16" fill="#FFFFFF"/>
  <rect x="155" y="184" width="105" height="16" fill="#FFFFFF"/>
  
  <!-- Camera Right Frame (Grey/Silver) -->
  <path d="M 255 86 H 335 V 200 H 255 V 184 H 317 V 102 H 255 Z" fill="#94A3B8"/>
  
  <!-- Central Big D & Lens Circle -->
  <!-- Lens circle behind/inside D -->
  <circle cx="250" cy="148" r="60" fill="none" stroke="#94A3B8" stroke-width="16"/>
  
  <!-- Bold D outline in foreground -->
  <path d="M 245 110 H 262 C 295 110, 312 126, 312 148 C 312 170, 295 186, 262 186 H 245 Z" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
  <!-- D vertical spine -->
  <rect x="237" y="110" width="16" height="76" fill="#FFFFFF"/>
  
  <!-- Typography Section -->
  <!-- ED.TECH -->
  <text x="250" y="325" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Prompt', -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="3">ED.TECH</text>
  
  <!-- Divider Line -->
  <rect x="30" y="340" width="440" height="7" fill="#FFFFFF" rx="3.5"/>
  
  <!-- AUDIO-VISUAL -->
  <text x="250" y="405" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Prompt', -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="4">AUDIO-VISUAL</text>
  
  <!-- VISUTTHARANGSI KANCHANABURI SCHOOL -->
  <text x="250" y="438" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Prompt', -apple-system, sans-serif" font-weight="700" font-size="16.5" letter-spacing="1.5">VISUTTHARANGSI KANCHANABURI SCHOOL</text>
</svg>
